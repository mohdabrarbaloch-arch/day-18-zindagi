services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zindagi
      POSTGRES_PASSWORD: zindagi
      POSTGRES_DB: zindagi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zindagi"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://zindagi:zindagi@db:5432/zindagi
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
